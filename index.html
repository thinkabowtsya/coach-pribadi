<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice Coach - 90 Days</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-header">
            <h1 onclick="app.navigate('dashboard')">EngCoach 90</h1>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" onclick="app.toggleMobileNav()">
                <span class="nav-toggle-icon" aria-hidden="true">&#9776;</span>
                <span>Menu</span>
            </button>
        </div>
        <div class="nav-links" id="nav-links">
            <button id="nav-dashboard" onclick="app.navigate('dashboard')" class="active">Dashboard</button>
            <button id="nav-chunks" onclick="app.navigate('chunks')">Chunks</button>
            <button id="nav-vocab" onclick="app.navigate('vocab')">Vocab A-Z</button>
            <button id="nav-verbs" onclick="app.navigate('verbs')">Verbs A-Z</button>
            <button id="nav-grammar" onclick="app.navigate('grammar')">Simple Grammar</button>
            <button id="nav-scripts" onclick="app.navigate('scripts')">My Speaking Scripts</button>
            <button id="nav-story-builder" onclick="app.navigate('story-builder')">Story Builder</button>
            <button id="nav-shadowing" onclick="app.navigate('shadowing')">Shadowing Library</button>
            <button id="nav-topic-library" onclick="app.navigate('topic-library')">Personal Topic Library</button>
            <button id="nav-review" onclick="app.navigate('review')">Review</button>
            <button id="nav-progress" onclick="app.navigate('progress')">My Progress</button>
        </div>
    </nav>

    <div class="container" id="app-content">
        <!-- Content dynamically rendered -->
    </div>

<script src="app.js"></script>
</body>
</html>
